services:
  mysql:
    image: whatsm97/database:latest
    platform: linux/amd64
    container_name: database
    environment:
      MYSQL_ROOT_PASSWORD: mypassword
    ports:
      - "3306:3306"
    networks:
      - my_networkSQL
    volumes:
      - mysql_data:/var/lib/mysql

  db-init:
    image: mysql:latest
    platform: linux/amd64
    container_name: db-init
    command: >
      /bin/bash -c "
        echo 'Waiting for MySQL to start...'
        while ! mysql -h database -u root -pmypassword -e 'SELECT 1' >/dev/null 2>&1; do
          sleep 1
        done
        echo 'MySQL started, executing initialization script...'
 
        echo 'Initialization completed'
      "
    networks:
      - my_networkSQL
    depends_on:
      - mysql
  
  php-apache:
    image: whatsm97/sito:latest
    platform: linux/amd64
    container_name: sito
    command: >
      /bin/bash -c "
        echo 'Initializing database with populateDB.php...'
        php /var/www/html/populateDB.php
        echo 'Database population completed, starting Apache...'
        apache2-foreground
      "
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    networks:
      - my_networkSQL
    depends_on:
      db-init:
        condition: service_completed_successfully

networks:
  my_networkSQL:
    driver: bridge
volumes:
  mysql_data: