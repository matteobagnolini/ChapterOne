services:
  php-apache:
    image: whatsm97/sito:latest  # Usa l'immagine salvata del container PHP
    container_name: sito
    command: apache2-foreground 
    ports:
      - "8080:80"  # Mappa la porta 8080 del tuo host alla porta 80 del container
    volumes:
      - ./src:/var/www/html  # Monta la cartella corrente nel container
    networks:
      - my_networkSQL

  mysql:
    image: whatsm97/database:latest  # Usa l'immagine ufficiale di MySQL
    container_name: database
    environment:
      MYSQL_ROOT_PASSWORD: mypassword  # Imposta la password di root
    ports:
      - "3306:3306"  # Mappa la porta 3306 del tuo host alla porta 3306 del container
    networks:
      - my_networkSQL
    volumes:
      - mysql_data:/var/lib/mysql  # Usa il volume per salvare i dati del database

networks:
  my_networkSQL:
    driver: bridge

volumes:
  mysql_data:  # Definisce il volume persistente per i dati del database
